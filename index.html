<!doctype html>
<html lang="id" data-theme="garuda" data-mode="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070b12">
  <title>Phantom Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Rajdhani:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="robot/style.css">
  <link rel="stylesheet" href="shared/hub.css">
  <script src="shared/core.js" defer></script>
  <script src="home.js" defer></script>
</head>
<body>
  <section id="login" class="login" hidden>
    <form id="login-form" class="card login-card" autocomplete="off">
      <div class="logo logo-lg">
        <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 3 6 10v13c0 11 7.6 19.4 18 22 10.4-2.6 18-11 18-22V10L24 3Z" fill="none" stroke="currentColor" stroke-width="3"/><path d="M14 25h7l3-7 4 13 3-6h3" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <div><strong>PHANTOM</strong><span>Dashboard Hub</span></div>
      </div>
      <p class="muted">Masukkan token Ubidots. Token hanya disimpan di browser ini dan dipakai bersama semua dashboard.</p>
      <label class="field">
        <span>Token Ubidots</span>
        <div class="with-btn">
          <input id="login-token" type="password" required placeholder="BBUS-xxxxxxxx" spellcheck="false" autocapitalize="off">
          <button type="button" class="btn ghost" data-reveal="login-token">Lihat</button>
        </div>
      </label>
      <p id="login-error" class="error" role="alert" hidden></p>
      <button type="submit" class="btn primary big" id="login-submit">Masuk</button>
    </form>
  </section>

  <div id="app" hidden>
    <header class="topbar">
      <div class="logo">
        <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 3 6 10v13c0 11 7.6 19.4 18 22 10.4-2.6 18-11 18-22V10L24 3Z" fill="none" stroke="currentColor" stroke-width="3"/><path d="M14 25h7l3-7 4 13 3-6h3" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <div><strong>PHANTOM</strong><span>Dashboard Hub</span></div>
      </div>
      <div class="link-status cloud-pill" id="cloud-pill"><span class="dot"></span><span class="cloud-text">—</span></div>
      <div class="clock" aria-label="Jam WIB"><span id="clock-time">--:--:--</span><small id="clock-date"></small></div>
      <div class="top-actions">
        <button class="btn top-btn settings-btn" id="open-settings" aria-label="Pengaturan"><span aria-hidden="true">⚙</span><span class="lbl">Pengaturan</span></button>
      </div>
    </header>

    <div id="banner" class="banner" role="status" hidden></div>

    <main class="hub-main">
      <div class="toolbar">
        <h1>Dashboard</h1>
        <div class="toolbar-actions">
          <button class="btn primary" id="add-dashboard">+ Tambah Dashboard</button>
          <button class="btn ghost" id="restore-builtins" hidden>Pulihkan bawaan</button>
          <button class="btn ghost" id="export-all">Export JSON</button>
          <button class="btn ghost" id="import-all">Import JSON</button>
          <input type="file" id="import-file" accept="application/json,.json" hidden>
        </div>
      </div>
      <div id="dash-grid" class="dash-grid"></div>
    </main>
  </div>

  <dialog id="settings" class="sheet">
    <form id="settings-form" method="dialog">
      <h2>Pengaturan</h2>
      <fieldset class="field">
        <legend>Tema warna</legend>
        <div class="swatches" id="theme-swatches"></div>
      </fieldset>
      <fieldset class="field">
        <legend>Mode tampilan</legend>
        <div class="segmented">
          <label class="seg"><input type="radio" name="mode" value="dark"><span>🌙 Gelap</span></label>
          <label class="seg"><input type="radio" name="mode" value="light"><span>☀️ Terang</span></label>
        </div>
      </fieldset>
      <label class="field">
        <span>Token Ubidots</span>
        <div class="with-btn">
          <input id="set-token" type="password" spellcheck="false" autocapitalize="off">
          <button type="button" class="btn ghost" data-reveal="set-token">Lihat</button>
        </div>
        <small class="muted">Dipakai bersama dashboard Robot dan semua dashboard builder.</small>
      </label>
      <div class="dialog-actions">
        <button type="submit" value="save" class="btn primary">Simpan</button>
        <button type="submit" value="cancel" class="btn ghost" formnovalidate>Batal</button>
      </div>
      <hr>
      <button type="button" id="logout" class="btn danger wide">Logout &amp; hapus token</button>
    </form>
  </dialog>

  <dialog id="dash-dialog" class="sheet">
    <form id="dash-form" method="dialog" novalidate>
      <h2 id="dash-dialog-title">Tambah Dashboard</h2>
      <div class="form-grid">
        <label class="field full"><span>Nama</span><input name="name" type="text" maxlength="40" required></label>
        <label class="field"><span>Ikon (emoji)</span><input name="icon" type="text" maxlength="4"></label>
        <label class="field" id="dash-device-field"><span>Device label utama</span><input name="device" type="text" spellcheck="false" autocapitalize="off" placeholder="mis. logger"></label>
        <label class="field full" id="dash-template-field"><span>Mulai dari</span>
          <select name="template">
            <option value="empty">Kosong</option>
            <option value="logger">Salinan preset Data Logger</option>
          </select>
        </label>
      </div>
      <p class="hint" id="dash-device-hint" hidden>Device robot diatur di halaman Robot → ⚙ Pengaturan.</p>
      <p id="dash-error" class="error" role="alert" hidden></p>
      <div class="dialog-actions">
        <button type="submit" value="save" class="btn primary">Simpan</button>
        <button type="submit" value="cancel" class="btn ghost" formnovalidate>Batal</button>
      </div>
    </form>
  </dialog>

  <dialog id="actions" class="sheet">
    <form method="dialog">
      <h2 id="actions-title">Dashboard</h2>
      <div class="action-list" id="action-list"></div>
      <div class="dialog-actions" style="grid-template-columns: 1fr"><button value="cancel" class="btn ghost">Tutup</button></div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
