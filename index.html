<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1117">
  <title>Phantom Control</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <section id="login" class="login" hidden>
    <form id="login-form" class="card login-card" autocomplete="off">
      <h1 class="brand">PHANTOM <span>GARUDA Operation</span></h1>
      <p class="muted">Masukkan token Ubidots. Token hanya disimpan di browser ini (localStorage).</p>
      <label class="field">
        <span>Token Ubidots</span>
        <div class="with-btn">
          <input id="login-token" type="password" required placeholder="BBUS-xxxxxxxx" spellcheck="false" autocapitalize="off">
          <button type="button" class="btn ghost" data-reveal="login-token">Lihat</button>
        </div>
      </label>
      <label class="field">
        <span>Device label</span>
        <input id="login-device" type="text" required spellcheck="false" autocapitalize="off">
      </label>
      <p id="login-error" class="error" role="alert" hidden></p>
      <button type="submit" class="btn primary big" id="login-submit">Masuk</button>
    </form>
  </section>

  <div id="app" hidden>
    <header class="topbar">
      <div class="brand">PHANTOM <span>GARUDA Operation</span></div>
      <div class="topbar-actions">
        <span id="robot-status" class="pill" title="Aktivitas terakhir robot">—</span>
        <button class="btn ghost icon" id="open-settings" aria-label="Pengaturan">⚙</button>
      </div>
    </header>

    <div id="banner" class="banner" role="alert" hidden></div>

    <main class="layout">
      <section class="panel">
        <h2>Monitoring <small id="last-update" class="muted"></small></h2>
        <div id="sensor-grid" class="sensor-grid"></div>
      </section>

      <section class="panel">
        <h2>Grafik suhu</h2>
        <div class="card chart-card">
          <div class="chart-box"><canvas id="chart" aria-label="Grafik suhu realtime"></canvas></div>
          <p id="chart-fallback" class="muted" hidden>Grafik tidak tersedia (Chart.js gagal dimuat).</p>
        </div>
      </section>

      <section class="panel">
        <h2>Kontrol</h2>
        <div id="control-groups" class="control-groups"></div>
      </section>

      <section class="panel">
        <h2>Kamera</h2>
        <div class="card camera-card">
          <p class="muted" id="camera-info"></p>
          <button class="btn primary big" id="open-camera">Buka Kamera ↗</button>
        </div>
      </section>
    </main>

    <div class="estop-bar">
      <button id="estop" class="estop">STOP DARURAT</button>
    </div>
  </div>

  <dialog id="settings" class="settings">
    <form id="settings-form" method="dialog">
      <h2>Pengaturan</h2>
      <label class="field">
        <span>Device label</span>
        <input id="set-device" type="text" required spellcheck="false" autocapitalize="off">
      </label>
      <label class="field">
        <span>IP / URL kamera ESP32-CAM</span>
        <input id="set-camera" type="text" placeholder="192.168.1.50 atau http://192.168.1.50:81/stream" spellcheck="false" autocapitalize="off">
      </label>
      <label class="field">
        <span>Interval polling (detik)</span>
        <input id="set-interval" type="number" min="0.5" max="60" step="0.5" required>
      </label>
      <label class="field">
        <span>Token Ubidots</span>
        <div class="with-btn">
          <input id="set-token" type="password" spellcheck="false" autocapitalize="off">
          <button type="button" class="btn ghost" data-reveal="set-token">Lihat</button>
        </div>
      </label>
      <div class="settings-actions">
        <button type="submit" value="save" class="btn primary">Simpan</button>
        <button type="submit" value="cancel" class="btn ghost" formnovalidate>Batal</button>
      </div>
      <hr>
      <button type="button" id="logout" class="btn danger">Logout &amp; hapus token</button>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
